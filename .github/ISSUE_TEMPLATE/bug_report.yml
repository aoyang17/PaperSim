name: Bug report
description: Report a deterministic PaperSim failure
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, Python version, schema version, and non-secret inputs.
    validations:
      required: true
  - type: checkboxes
    id: secrets
    attributes:
      label: Secret check
      options:
        - label: I removed credentials, private keys, host names, accounts, and private paths.
          required: true
